services:
  mysql-main:
    image: mysql:9.7.2
    container_name: isw2-mysql-main
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_main_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - isw2-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-main:
    image: postgres:18.6
    container_name: isw2-postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: America/Lima
    ports:
      - "5434:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql
      - ./postgres-main/init:/docker-entrypoint-initdb.d:ro
    networks:
      - isw2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-yape:
    image: postgres:18.6
    container_name: isw2-postgres-yape
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_YAPE_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: America/Lima
    ports:
      - "5435:5432"
    volumes:
      - postgres_yape_data:/var/lib/postgresql
      - ./postgres-yape/init:/docker-entrypoint-initdb.d:ro
    networks:
      - isw2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-plin:
    image: postgres:18.6
    container_name: isw2-postgres-plin
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PLIN_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: America/Lima
    ports:
      - "5436:5432"
    volumes:
      - postgres_plin_data:/var/lib/postgresql
      - ./postgres-plin/init:/docker-entrypoint-initdb.d:ro
    networks:
      - isw2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  adminer:
    image: adminer:latest
    container_name: isw2-adminer
    restart: unless-stopped
    depends_on:
      mysql-main:
        condition: service_healthy
      postgres-main:
        condition: service_healthy
      postgres-yape:
        condition: service_healthy
      postgres-plin:
        condition: service_healthy
    ports:
      - "8085:8080"
    networks:
      - isw2-net

networks:
  isw2-net:
    name: isw2-net
    driver: bridge

volumes:
  mysql_main_data:
  postgres_main_data:
  postgres_yape_data:
  postgres_plin_data:
